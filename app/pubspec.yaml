name: ytwchat
description: ytwchat, end-to-end encrypted messages, voice notes and calls.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  flutter_webrtc: ^1.5.2
  just_audio: ^0.9.36
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  flutter_contacts: ^2.1.0
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  audio_waveforms: ^1.0.5
  flutter_sound: ^9.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
