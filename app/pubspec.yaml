name: ytwchat
description: ytwchat, end-to-end encrypted messages, voice notes and calls.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  flutter_webrtc: ^1.5.2
  just_audio: ^0.9.36
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  flutter_contacts: ^2.1.0
  url_launcher: ^6.3.2
  flutter_sound: ^9.28.0
  ytwchat_core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  sqflite_sqlcipher: ^3.4.1
  sqflite_common: ^2.5.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
