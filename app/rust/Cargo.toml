[package]
name = "ytwchat_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
openmls_traits = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
aes-siv = "0.7"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
